<?xml version="1.0" encoding="UTF-8"?>
<!--
  KompasKade Reizen - logo.svg
  Simpel eigen SVG-logo (kompas) zodat je niet afhankelijk bent van externe images.
  Je mag dit aanpassen in kleur of vorm als je wil.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KompasKade Reizen logo">
  <title>KompasKade Reizen</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3D91"/>
      <stop offset="1" stop-color="#082D6B"/>
    </linearGradient>
  </defs>

  <!-- Buitenring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#g)" stroke-width="4"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#0B3D91" stroke-opacity=".25" stroke-width="2"/>

  <!-- Noordpijl -->
  <path d="M32 10 L38 30 L32 26 L26 30 Z" fill="#F97316"/>
  <!-- Zuidpijl -->
  <path d="M32 54 L26 34 L32 38 L38 34 Z" fill="#0B3D91"/>

  <!-- Middenpunt -->
  <circle cx="32" cy="32" r="3" fill="#0B3D91"/>
</svg>
